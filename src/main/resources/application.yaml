spring:
  application:
    name: ifs25023-p5-pbo2026-springboot-cashflow
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:pbo2026_cashflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  devtools:
    restart:
      enabled: true
      # Polling lebih andal di Windows daripada native file watch.
      poll-interval: 1s
      quiet-period: 400ms
    liveload:
      enabled: true

server:
  port: ${APP_PORT:${PORT:8080}}
  # Penting di balik reverse proxy HTTPS (s1if.cloud): URL dan cookie mengikuti header X-Forwarded-*.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 8h
      cookie:
        name: CASHFLOWSESSION
        http-only: true
        same-site: lax

app:
  root-username: ${ROOT_USERNAME:admin}
  root-password: ${ROOT_PASSWORD:admin}
  upload-dir: ${UPLOAD_DIR:uploads}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
